# Application
quarkus.application.name=organizador-treinos-api
quarkus.application.version=1.0.0

# Database - PostgreSQL
# Production (Supabase): DB_URL=jdbc:postgresql://db.XXXX.supabase.co:5432/postgres?sslmode=require
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/organizador_treinos}
quarkus.datasource.jdbc.acquisition-timeout=30

# JPA/Hibernate
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.packages=org.organizadorTreinos.entity

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/changelog-master.xml

# HTTP - Render assigns PORT automatically (usually 10000)
quarkus.http.port=${PORT:8080}

# JWT Configuration
# Production: set JWT_PUBLIC_KEY_PATH and JWT_PRIVATE_KEY_PATH to absolute paths written by entrypoint
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH:publicKey.pem}
mp.jwt.verify.issuer=https://organizador-treinos.com
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH:privateKey.pem}
smallrye.jwt.new-token.lifespan=1800

# SmallRye JWT reads access token from cookie instead of Authorization header
mp.jwt.token.cookie=access_token
mp.jwt.token.header=Cookie

# Cookie security: false in dev (HTTP), true in prod (HTTPS only)
app.cookie.secure=true
%dev.app.cookie.secure=false

# Cookie SameSite: NONE in prod (cross-domain Vercel→Render), LAX in dev (same-site localhost)
# SameSite=NONE requires Secure=true (already set above for prod)
app.cookie.samesite=NONE
%dev.app.cookie.samesite=LAX

# CORS Configuration
# Production: CORS_ORIGINS=https://your-app.vercel.app
# Credentials (cookies) require an explicit origin — wildcards are not allowed.
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.access-control-allow-credentials=true

# Logging — production: ERROR-only for app package, stack traces visible only at DEBUG
quarkus.log.level=INFO
quarkus.log.console.level=INFO
quarkus.log.category."org.organizadorTreinos".level=INFO

# Dev profile: verbose logging with full stack traces
%dev.quarkus.log.level=DEBUG
%dev.quarkus.log.console.level=DEBUG
%dev.quarkus.log.category."org.organizadorTreinos".level=DEBUG

# Test profile: keep INFO to avoid noisy test output
%test.quarkus.log.category."org.organizadorTreinos".level=INFO

# Native build resources
quarkus.native.resources.includes=publicKey.pem,email-templates/**

# Email (Resend SDK)
resend.api-key=${RESEND_API_KEY}
%dev.resend.api-key=${RESEND_API_KEY:re_dev_dummy}
resend.from-email=${FROM_EMAIL:Organizador de Treinos <noreply@seudominio.com>}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Test profile - dummy key so Quarkus starts without RESEND_API_KEY env var
%test.resend.api-key=re_test_dummy

# Auth rate limiting (Bucket4j, in-memory)
auth.ratelimit.enabled=true
auth.ratelimit.login.capacity=5
auth.ratelimit.login.window-minutes=15
auth.ratelimit.signup.capacity=3
auth.ratelimit.signup.window-minutes=60
auth.ratelimit.forgot-password.capacity=3
auth.ratelimit.forgot-password.window-minutes=60

# In tests, default to permissive limits so existing auth tests aren't affected.
# AuthRateLimitTest overrides these via @TestProfile.
%test.auth.ratelimit.login.capacity=1000
%test.auth.ratelimit.signup.capacity=1000
%test.auth.ratelimit.forgot-password.capacity=1000