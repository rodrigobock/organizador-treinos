# Development Profile Configuration

# Database - PostgreSQL (docker-compose service)
quarkus.datasource.jdbc.url=jdbc:postgresql://db:5432/organizador_treinos
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# Logging - More verbose for development
quarkus.log.level=DEBUG
quarkus.log.console.level=DEBUG
quarkus.log.category."org.hibernate".level=DEBUG
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.validate-on-migrate=true

# CORS - Allow local development servers
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:8080
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.credentials=true

# JWT - 24 hours for development
smallrye.jwt.new-token.lifespan=86400
